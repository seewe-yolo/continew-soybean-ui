packages:
  - 'packages/*'
allowBuilds:
  '@vue-office/docx': true
  '@vue-office/excel': true
  '@vue-office/pdf': true
  '@parcel/watcher': false
  es5-ext: true
  esbuild: false
  simple-git-hooks: false
  vue-demi: false
shamefullyHoist: true
ignoreWorkspaceRootCheck: true
linkWorkspacePackages: true
